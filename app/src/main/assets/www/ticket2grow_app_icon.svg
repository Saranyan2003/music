<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="256" r="180" fill="#1DB954" opacity="0.08" filter="blur(40px)" />

  <!-- Center Icon: Dynamic 'T' + '2' with Upward Growth Arrow -->
  <g transform="translate(116, 126)">
    <!-- Ticket & Growth Monogram Symbol -->
    <path d="M 40 20 L 240 20 L 240 70 L 165 70 L 165 240 L 115 240 L 115 70 L 40 70 Z" fill="#FFFFFF"/>
    
    <!-- Dynamic Arrow 2 Overlay in Emerald Green -->
    <path d="M 175 140 C 205 140 230 160 230 190 C 230 220 200 250 160 270 L 240 270 L 240 290 L 130 290 C 130 250 170 230 195 210 C 205 200 210 195 210 185 C 210 170 195 160 180 160 C 165 160 155 170 150 180 L 130 165 C 140 148 158 140 175 140 Z" fill="url(#accentGrad)"/>
    <!-- Growth Arrow -->
    <polygon points="210,100 260,100 260,150 242,150 242,125 195,172 182,159 229,112 210,112" fill="url(#accentGrad)"/>
  </g>
</svg>
