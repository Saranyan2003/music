<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#000000" />
  <g fill="#FFFFFF" transform="translate(60, 40)">
    <!-- Ticket text -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="100" font-weight="900" letter-spacing="-1.5">Ticket</text>
    
    <!-- Custom Stylized '2' with Upward Growth Arrow -->
    <g transform="translate(300, 20)">
      <!-- Base curve & body of 2 -->
      <path d="M 12 35 C 12 14 30 0 54 0 C 78 0 94 15 94 36 C 94 54 80 72 58 92 L 28 118 L 95 118 C 95 118 95 128 95 132 C 95 132 10 132 10 132 C 10 126 15 118 22 110 L 52 82 C 68 66 74 54 74 38 C 74 25 64 16 52 16 C 40 16 32 24 31 35 Z" fill="#FFFFFF"/>
      <!-- Arrow inside the upper curve / upward momentum -->
      <polygon points="56,22 82,22 82,48 72,48 72,36 46,62 38,54 64,28 52,28" fill="#FFFFFF"/>
    </g>

    <!-- Grow text -->
    <text x="415" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="100" font-weight="900" letter-spacing="-1.5">Grow</text>
  </g>
</svg>
