name: Build Ticket2Grow Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Platforms & Build Tools
      run: |
        sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Prepare Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace

    - name: Upload Ticket2Grow APK
      uses: actions/upload-artifact@v4
      with:
        name: Ticket2Grow-Android-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
